<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1e2430;
      --muted: #667085;
      --line: #d9dee8;
      --accent: #2457d6;
      --accent-soft: #e8eefc;
      --good: #127a43;
      --review: #b45309;
      --shadow: 0 14px 36px rgba(31, 41, 55, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 7px;
      min-height: 38px;
      padding: 0 12px;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.active {
      background: var(--accent-soft);
      border-color: #adc0f6;
      color: #173b98;
    }

    button.danger {
      border-color: #fecaca;
      background: #fff1f2;
      color: #b91c1c;
    }

    .menu {
      min-height: 100vh;
      padding: 32px;
      display: grid;
      align-content: start;
      gap: 20px;
    }

    .menu-head {
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
    }

    h1, h2 {
      margin: 0;
      line-height: 1.25;
    }

    h1 { font-size: 30px; }
    h2 { font-size: 24px; }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .set-grid {
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .set-card {
      min-height: 150px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: grid;
      align-content: space-between;
      text-align: left;
    }

    .set-card strong {
      display: block;
      font-size: 22px;
      margin-bottom: 8px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .score-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .score-box strong {
      display: block;
      font-size: 28px;
      margin-top: 6px;
    }

    .review-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .review-table th,
    .review-table td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      font-size: 14px;
      vertical-align: top;
    }

    .review-table th {
      background: #f1f4f9;
      color: #3d4657;
    }

    .review-table tr.correct-row td {
      background: #f6fcf8;
    }

    .review-table tr.wrong-row td {
      background: #fff8f2;
    }

    .review-table tr.blank-row td {
      background: #fafafa;
      color: var(--muted);
    }

    .app {
      display: none;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 100vh;
    }

    .results-page {
      display: none;
      min-height: 100vh;
      padding: 32px;
      align-content: start;
      gap: 18px;
    }

    aside {
      border-right: 1px solid var(--line);
      background: #fbfcfe;
      padding: 20px;
      overflow: auto;
    }

    main {
      padding: 28px;
      display: grid;
      align-content: start;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .player, .work {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .work {
      padding: 22px;
      gap: 16px;
    }

    audio { width: 100%; }

    .controls, .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta, .headline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
    }

    .headline {
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .question-list {
      display: grid;
      gap: 8px;
    }

    .question-btn {
      width: 100%;
      text-align: left;
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 10px;
      min-height: 44px;
      font-weight: 700;
    }

    .question-btn .num, .choice .letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eef1f6;
      color: #3d4657;
      font-size: 13px;
    }

    .question-btn.done .num {
      background: #e6f4ed;
      color: var(--good);
    }

    .question-btn.review .num {
      background: #fff3df;
      color: var(--review);
    }

    .progress {
      height: 10px;
      background: #e7ebf2;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 160ms ease;
    }

    .prompt {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 15px;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      width: 100%;
      min-height: 48px;
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: center;
      gap: 10px;
      text-align: left;
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 700;
    }

    .choice.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #173b98;
    }

    .choice.selected .letter {
      background: var(--accent);
      color: #fff;
    }

    .choice.correct {
      border-color: var(--good);
      background: #e6f4ed;
      color: var(--good);
    }

    .choice.correct .letter {
      background: var(--good);
      color: #fff;
    }

    .choice.wrong {
      border-color: #c2410c;
      background: #fff0e8;
      color: #9a3412;
    }

    .choice.wrong .letter {
      background: #c2410c;
      color: #fff;
    }

    .result {
      display: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .result.correct {
      display: block;
      border-color: #b7e1c8;
      background: #f0faf4;
      color: var(--good);
    }

    .result.wrong {
      display: block;
      border-color: #fed7aa;
      background: #fff7ed;
      color: #9a3412;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      font: 18px/1.65 Arial, "Malgun Gothic", sans-serif;
      color: var(--ink);
      background: #fff;
    }

    @media (max-width: 880px) {
      .set-grid { grid-template-columns: 1fr; }
      .menu-head { display: block; }
      .app { grid-template-columns: 1fr; }
      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: 330px;
      }
      main, .menu { padding: 18px; }
    }
  </style>
</head>
<body>
  <section id="menu" class="menu">
    <div class="menu-head">
      <div>
        <h1>리스닝 문제 프로그램</h1>
        <p class="sub">세트 1부터 세트 5까지 선택해서 풀이합니다.</p>
      </div>
      <button class="danger" id="clearAllAnswers">전체 정답 지우기</button>
    </div>
    <div id="setGrid" class="set-grid"></div>
  </section>

  <div id="app" class="app">
    <aside>
      <button id="backToMenu">메뉴</button>
      <h1 id="setTitle">세트 1</h1>
      <p class="sub">문장 재생 후 풀이 시간 20초</p>
      <div class="progress" aria-label="진행률"><span id="progressBar"></span></div>
      <p class="sub"><span id="doneCount">0</span>/<span id="totalCount">0</span> 완료</p>
      <div id="questionList" class="question-list"></div>
    </aside>

    <main>
      <section class="panel player">
        <audio id="audio" controls preload="metadata"></audio>
        <div class="controls">
          <button class="primary" id="repeatCurrent">현재 문제 반복</button>
          <button id="pauseAudio">일시정지</button>
          <button id="prevQuestion">이전</button>
          <button id="nextQuestion">다음</button>
        </div>
        <div class="meta">
          <span id="timeNow">00:00</span>
          <span id="listenMode">문제별 재생</span>
        </div>
      </section>

      <section class="panel work">
        <div class="headline">
          <h2 id="questionTitle">문제 1</h2>
          <span class="badge" id="timeRange">문장 00:00</span>
        </div>
        <p class="prompt">오디오를 듣고 가장 자연스러운 응답을 고르세요.</p>
        <div id="choices" class="choices"></div>
        <div id="resultBox" class="result"></div>
        <div class="status-row">
          <button class="primary" id="checkAnswer">정답 확인</button>
          <button class="primary" id="showSetResults">세트 정답 확인</button>
          <button id="clearStatus">표시 지우기</button>
        </div>
      </section>
    </main>
  </div>

  <section id="resultsPage" class="results-page">
    <div class="menu-head">
      <div>
        <h1 id="resultsTitle">세트 결과</h1>
        <p class="sub" id="resultsSummary">채점 결과</p>
      </div>
      <div class="controls">
        <button id="resultsBackToSet">문제로 돌아가기</button>
        <button class="primary" id="resultsBackToMenu">메뉴</button>
      </div>
    </div>
    <div class="score-grid">
      <div class="score-box">정답<strong id="scoreCorrect">0</strong></div>
      <div class="score-box">오답<strong id="scoreWrong">0</strong></div>
      <div class="score-box">미응답<strong id="scoreBlank">0</strong></div>
    </div>
    <table class="review-table">
      <thead>
        <tr>
          <th>문제</th>
          <th>내 답</th>
          <th>정답</th>
          <th>결과</th>
        </tr>
      </thead>
      <tbody id="reviewBody"></tbody>
    </table>
  </section>

    function loadState(key) {
      const count = SETS[key].questions.length;
      const parsed = JSON.parse(localStorage.getItem("listening-" + key + "-state") || "{}");
      parsed.status ||= Array(count).fill("");
      parsed.selected ||= Array(count).fill("");
      parsed.revealed ||= Array(count).fill(false);
      return parsed;

      if (finalCountdownTimer) clearTimeout(finalCountdownTimer);
      if (finalCountdownInterval) clearInterval(finalCountdownInterval);
      finalCountdownTimer = null;
      finalCountdownInterval = null;
    }

    function formatTime(seconds) {
      const safe = Math.max(0, Math.floor(seconds || 0));
      return String(Math.floor(safe / 60)).padStart(2, "0") + ":" + String(safe % 60).padStart(2, "0");
    }

        const button = document.createElement("button");
        button.className = "set-card";
        button.innerHTML = "<span><strong>" + set.title + "</strong><span class=\"sub\">" + set.questions.length + "문제 · " + done + "/" + set.questions.length + " 완료</span></span><span class=\"sub\">" + set.audio + "</span>";
        button.addEventListener("click", () => openSet(key));
        setGrid.appendChild(button);
      });
    }

    function renderList() {
      questionList.innerHTML = "";
      activeSet.questions.forEach((question, index) => {
        const button = document.createElement("button");
        button.className = "question-btn " + (index === current ? "active" : "") + " " + (state.status[index] || "");
        const status = state.status[index] === "done" ? "맞음" : state.status[index] === "review" ? "복습" : "";
        button.innerHTML = "<span class=\"num\">" + (index + 1) + "</span><span>문제 " + question.number + "</span><span>" + status + "</span>";
        button.addEventListener("click", () => selectQuestion(index, true));
        questionList.appendChild(button);
      });
    }

    function renderProgress() {
      const done = state.status.filter((item) => item === "done").length;
      doneCount.textContent = done;
      progressBar.style.width = (done / activeSet.questions.length * 100) + "%";
    }

    function renderChoices() {
      choices.innerHTML = "";
      const question = activeSet.questions[current];
      const revealed = state.revealed[current];
      Object.entries(activeSet.questions[current].choices).forEach(([letter, text]) => {
        const button = document.createElement("button");
        let className = "choice " + (state.selected[current] === letter ? "selected" : "");
        if (revealed && letter === question.answer) className += " correct";
        if (revealed && state.selected[current] === letter && letter !== question.answer) className += " wrong";
        button.className = className;
        button.innerHTML = "<span class=\"letter\">" + letter + "</span><span>" + text + "</span>";
        button.addEventListener("click", () => {
          state.selected[current] = state.selected[current] === letter ? "" : letter;
          state.revealed[current] = false;
          save();
          renderChoices();
          renderResult();
        });
        choices.appendChild(button);
      });
    }

    function renderResult() {
      const question = activeSet.questions[current];
      const selected = state.selected[current];
      resultBox.className = "result";
      resultBox.textContent = "";
      if (!state.revealed[current]) return;
      const correctText = question.choices[question.answer] || "";
      const isCorrect = selected === question.answer;
      resultBox.className = "result " + (isCorrect ? "correct" : "wrong");
      resultBox.textContent = isCorrect
        ? "정답입니다. 정답: " + question.answer + ". " + correctText
        : "오답입니다. 정답: " + question.answer + ". " + correctText;
    }

    function selectQuestion(index, seek = false) {
      clearFinalCountdown();
      current = Math.min(activeSet.questions.length - 1, Math.max(0, index));
      const timing = activeSet.timings[current] || { start: 0, end: 0 };
      const question = activeSet.questions[current];
      questionTitle.textContent = "문제 " + question.number;
      timeRange.textContent = "문장 " + formatTime(timing.start) + " · 풀이 " + formatTime(timing.end) + "부터";
      renderList();
      renderProgress();
      renderChoices();
      renderResult();
      const isLastQuestion = current === activeSet.questions.length - 1;
      showSetResults.style.display = isLastQuestion ? "inline-grid" : "none";
      document.getElementById("nextQuestion").textContent = isLastQuestion ? "세트 정답 확인" : "다음";
      save();
      if (seek) audio.currentTime = timing.start;
    }

    function playCurrent() {
      clearFinalCountdown();
      const timing = activeSet.timings[current] || { start: 0 };
      mode = "single";
      listenMode.textContent = "자동 진행";
      audio.currentTime = timing.start;
      audio.play();
    }

    document.getElementById("backToMenu").addEventListener("click", showMenu);
    clearAllAnswers.addEventListener("click", () => {
      if (!confirm("모든 세트의 선택한 답과 채점 기록을 지울까요?")) return;
      Object.keys(SETS).forEach((key) => localStorage.removeItem("listening-" + key + "-state"));
      state = loadState(activeSetKey);
      renderMenu();
    });
    document.getElementById("repeatCurrent").addEventListener("click", playCurrent);
    document.getElementById("pauseAudio").addEventListener("click", () => {
      audio.pause();
      listenMode.textContent = "일시정지";
    });
    document.getElementById("checkAnswer").addEventListener("click", () => {
      state.revealed[current] = true;
      const question = activeSet.questions[current];
      if (state.selected[current] === question.answer) state.status[current] = "done";
      else state.status[current] = "review";
      save();
      renderChoices();
      renderResult();
      renderList();
      renderProgress();
    });
    document.getElementById("prevQuestion").addEventListener("click", () => selectQuestion(current - 1, true));
    document.getElementById("nextQuestion").addEventListener("click", () => {
      if (current === activeSet.questions.length - 1) showResults();
      else selectQuestion(current + 1, true);
    });
    showSetResults.addEventListener("click", showResults);
    document.getElementById("clearStatus").addEventListener("click", () => {
      state.status[current] = "";
      state.selected[current] = "";
      state.revealed[current] = false;
      save();
      selectQuestion(current);
    });

    function showResults() {
      clearFinalCountdown();
      audio.pause();
      save();
      let correct = 0;
      let wrong = 0;
      let blank = 0;
      reviewBody.innerHTML = "";

      activeSet.questions.forEach((question, index) => {
        const selected = state.selected[index] || "";
        const isBlank = !selected;
        const isCorrect = selected === question.answer;
        if (isBlank) blank++;
        else if (isCorrect) correct++;
        else wrong++;

        const row = document.createElement("tr");
        row.className = isBlank ? "blank-row" : isCorrect ? "correct-row" : "wrong-row";
        row.innerHTML =
          "<td>문제 " + question.number + "</td>" +
          "<td>" + (selected || "-") + "</td>" +
          "<td>" + question.answer + "</td>" +
          "<td>" + (isBlank ? "미응답" : isCorrect ? "정답" : "오답") + "</td>";
        reviewBody.appendChild(row);
      });

      resultsTitle.textContent = activeSet.title + " 결과";
      resultsSummary.textContent = "총 " + activeSet.questions.length + "문제 중 " + correct + "문제 정답";
      scoreCorrect.textContent = correct;
      scoreWrong.textContent = wrong;
      scoreBlank.textContent = blank;
      menu.style.display = "none";
      app.style.display = "none";
      resultsPage.style.display = "grid";
      listenMode.textContent = "세트 완료";
    }

    function startFinalCountdown() {
      clearFinalCountdown();
      let remaining = 20;
      listenMode.textContent = "풀이 시간 " + remaining + "초";
      finalCountdownInterval = setInterval(() => {
        remaining--;
        listenMode.textContent = "풀이 시간 " + Math.max(0, remaining) + "초";
      }, 1000);
      finalCountdownTimer = setTimeout(showResults, 20000);
    }

    document.getElementById("resultsBackToSet").addEventListener("click", () => {
      resultsPage.style.display = "none";
      menu.style.display = "none";
      app.style.display = "grid";
      selectQuestion(current, true);
    });

    document.getElementById("resultsBackToMenu").addEventListener("click", showMenu);

    audio.addEventListener("timeupdate", () => {
      timeNow.textContent = formatTime(audio.currentTime);
      while (current < activeSet.questions.length - 1 && activeSet.timings[current + 1] && audio.currentTime >= activeSet.timings[current + 1].start - 0.1) {
        selectQuestion(current + 1, false);
      }

      const timing = activeSet.timings[current] || { start: 0, end: audio.currentTime };
      const nextStart = current < activeSet.questions.length - 1 && activeSet.timings[current + 1]
        ? activeSet.timings[current + 1].start
        : timing.end + 20;
      const isAnswerTime = audio.currentTime >= timing.end;
      const remaining = Math.max(0, nextStart - Math.max(audio.currentTime, timing.end));
      listenMode.textContent = isAnswerTime ? "풀이 시간 " + Math.ceil(remaining) + "초" : "듣는 중";

      if (current === activeSet.questions.length - 1 && audio.currentTime >= nextStart) {
        showResults();
      }
    });

    audio.addEventListener("ended", () => {
      if (current === activeSet.questions.length - 1) startFinalCountdown();
      else showResults();
    });

    renderMenu();
  </script>
</body>
</html>
